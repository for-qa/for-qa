<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Gradients, Glow Filters and Clip Paths -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d16" />
      <stop offset="50%" stop-color="#0e1324" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="engine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="success-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="playwright-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ead33" />
      <stop offset="100%" stop-color="#abdb2a" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Grid Overlay -->
  <g opacity="0.07">
    <path d="M 0,40 H 800 M 0,80 H 800 M 0,120 H 800 M 0,160 H 800 M 0,200 H 800 M 0,240 H 800 M 0,280 H 800 M 0,320 H 800 M 0,360 H 800 M 0,400 H 800 M 0,440 H 800" stroke="#94a3b8" stroke-width="1" />
    <path d="M 40,0 V 480 M 80,0 V 480 M 120,0 V 480 M 160,0 V 480 M 200,0 V 480 M 240,0 V 480 M 280,0 V 480 M 320,0 V 480 M 360,0 V 480 M 400,0 V 480 M 440,0 V 480 M 480,0 V 480 M 520,0 V 480 M 560,0 V 480 M 600,0 V 480 M 640,0 V 480 M 680,0 V 480 M 720,0 V 480 M 760,0 V 480" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Glowing background blobs -->
  <circle cx="150" cy="180" r="100" fill="#a855f7" opacity="0.08" filter="url(#glow-purple)" />
  <circle cx="480" cy="240" r="120" fill="#3b82f6" opacity="0.08" filter="url(#glow-cyan)" />
  <circle cx="700" cy="380" r="80" fill="#10b981" opacity="0.08" filter="url(#glow-green)" />

  <!-- TITLE BLOCK -->
  <text x="40" y="45" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.025em">AGENTIC E2E FRAMEWORK</text>
  <text x="40" y="65" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500">AUTONOMOUS PLAYWRIGHT ENGINE ORCHESTRATION</text>

  <!-- TECH LOGOS (Top Right) -->
  <!-- TypeScript Logo -->
  <g transform="translate(640, 25)">
    <rect width="32" height="32" rx="6" fill="#3178c6" />
    <text x="14" y="24" fill="white" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="800">TS</text>
  </g>
  
  <!-- Playwright Logo Custom Vector -->
  <g transform="translate(685, 22)">
    <!-- Playwright Green Ribbon /Theater Mask stylized representation -->
    <path d="M12 4C7.58 4 4 7.58 4 12C4 16.42 7.58 20 12 20C16.42 20 20 16.42 20 12C20 7.58 16.42 4 12 4ZM12 6C15.31 6 18 8.69 18 12C18 13.08 17.71 14.1 17.21 14.98L13.88 9.21C13.56 8.66 12.82 8.44 12.23 8.7L8.98 10.15L6.68 6.46C7.94 6.17 9.87 6 12 6Z" fill="url(#playwright-logo-grad)" filter="url(#glow-green)" opacity="0.9" />
    <path d="M7 12C7 10.22 7.78 8.62 9.02 7.54L11.5 11.5L8.5 16.2C7.56 15.11 7 13.62 7 12Z" fill="#ff7a00" />
  </g>

  <!-- GitHub Actions Logo -->
  <g transform="translate(730, 25)">
    <rect width="32" height="32" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <path d="M10 16C10 17.1 10.9 18 12 18H20C21.1 18 22 17.1 22 16V10C22 8.9 21.1 8 20 8H12C10.9 8 10 8.9 10 10V16ZM12 10H20V16H12V10ZM6 8C6 6.9 6.9 6 8 6H16V8H8V16H6V8Z" fill="#2088ff" />
  </g>

  <!-- ==================== FLOW DIAGRAM CONNECTORS ==================== -->
  <g opacity="0.6">
    <!-- AI Layer to Execution Layer Arrow -->
    <path d="M 230,240 C 290,240 290,260 350,260" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6,4" />
    <polygon points="350,260 342,255 342,265" fill="#a855f7" />

    <!-- AC to Planner -->
    <path d="M 150,145 V 175" stroke="#ec4899" stroke-width="2" />
    <!-- Planner to Gen -->
    <path d="M 150,235 V 265" stroke="#ec4899" stroke-width="2" />
    <!-- Gen to Reviewer -->
    <path d="M 150,325 V 355" stroke="#ec4899" stroke-width="2" />

    <!-- Config to Scheduler -->
    <path d="M 470,165 V 195" stroke="#3b82f6" stroke-width="2" />
    <!-- Scheduler to Runner -->
    <path d="M 470,255 V 285" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Engine to Runner -->
    <path d="M 470,345 V 315" stroke="#3b82f6" stroke-width="2" />

    <!-- Runner to Shard Executor -->
    <path d="M 570,300 H 670" stroke="#06b6d4" stroke-width="2" />
    <polygon points="670,300 662,296 662,304" fill="#06b6d4" />
  </g>

  <!-- ==================== LAYER 1: AI ORCHESTRATION LAYER (Left) ==================== -->
  
  <!-- Group Title -->
  <rect x="40" y="85" width="220" height="24" rx="4" fill="#1e1e30" />
  <text x="50" y="101" fill="#c084fc" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">1. AI ORCHESTRATION LAYER</text>

  <!-- Node: Acceptance Criteria -->
  <g transform="translate(40, 115)">
    <rect width="220" height="30" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <circle cx="20" cy="15" r="5" fill="#f43f5e" />
    <text x="35" y="19" fill="#f1f5f9" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">Acceptance Criteria (AC)</text>
  </g>

  <!-- Node: AI Planner Agent -->
  <g transform="translate(40, 175)">
    <rect width="220" height="60" rx="8" fill="#18142c" stroke="#a855f7" stroke-width="1.5" />
    <!-- AI Spark Icon -->
    <path d="M18 12L19.5 15.5L23 17L19.5 18.5L18 22L16.5 18.5L13 17L16.5 15.5L18 12Z" fill="#a855f7" filter="url(#glow-purple)"/>
    <text x="45" y="27" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700">AI Planner Agent</text>
    <text x="45" y="42" fill="#a78bfa" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500">Maps AC requirements into blueprints</text>
  </g>

  <!-- Node: AI Generator Agent -->
  <g transform="translate(40, 265)">
    <rect width="220" height="60" rx="8" fill="#18142c" stroke="#ec4899" stroke-width="1.5" />
    <path d="M18 12L19.5 15.5L23 17L19.5 18.5L18 22L16.5 18.5L13 17L16.5 15.5L18 12Z" fill="#ec4899" />
    <text x="45" y="27" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700">AI Generator Agent</text>
    <text x="45" y="42" fill="#f472b6" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500">Generates 100% stable Playwright tests</text>
  </g>

  <!-- Node: AI Reviewer & Refiner Agent -->
  <g transform="translate(40, 355)">
    <rect width="220" height="60" rx="8" fill="#18142c" stroke="#db2777" stroke-width="1.5" />
    <path d="M18 12L19.5 15.5L23 17L19.5 18.5L18 22L16.5 18.5L13 17L16.5 15.5L18 12Z" fill="#db2777" />
    <text x="45" y="27" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700">AI Reviewer Agent</text>
    <text x="45" y="42" fill="#f472b6" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500">Enforces clean architecture & Vitest linting</text>
  </g>

  <!-- ==================== LAYER 2: CORE TEST ENGINE (Center) ==================== -->
  
  <!-- Group Title -->
  <rect x="360" y="85" width="220" height="24" rx="4" fill="#111c30" />
  <text x="370" y="101" fill="#60a5fa" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">2. CORE TEST ENGINE LAYER</text>

  <!-- Node: TestSuiteConfiguration -->
  <g transform="translate(360, 115)">
    <rect width="220" height="50" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="15" y="22" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700">TestSuiteConfiguration</text>
    <text x="15" y="36" fill="#93c5fd" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="500">Modular shard setups & setup configs</text>
  </g>

  <!-- Node: Priority Scheduler -->
  <g transform="translate(360, 195)">
    <rect width="220" height="60" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="15" y="15" width="20" height="20" rx="4" fill="#06b6d4" opacity="0.2" />
    <path d="M20 20 L23 25 L30 25" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <text x="45" y="27" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700">Priority Scheduler</text>
    <text x="45" y="42" fill="#67e8f9" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500">Tags, queues, and parallel scheduling</text>
  </g>

  <!-- Node: Parallel Test Runner -->
  <g transform="translate(360, 285)">
    <rect width="220" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <circle cx="25" cy="30" r="8" fill="#3b82f6" opacity="0.2" />
    <circle cx="25" cy="30" r="4" fill="#3b82f6" />
    <text x="45" y="27" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700">Parallel Test Runner</text>
    <text x="45" y="42" fill="#93c5fd" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500">Drives Playwright Playbacks in background</text>
  </g>

  <!-- Node: Vitest / Clean Utils -->
  <g transform="translate(360, 375)">
    <rect width="220" height="40" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="15" y="18" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">Vitest Test Utils</text>
    <text x="15" y="30" fill="#64748b" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="500">Path normalization & data generators</text>
  </g>

  <!-- ==================== LAYER 3: EXECUTION & SHARDS (Right) ==================== -->

  <!-- Group Title -->
  <rect x="650" y="85" width="110" height="24" rx="4" fill="#0c201a" />
  <text x="660" y="101" fill="#10b981" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">3. EXECUTION</text>

  <!-- Shard Shards representation -->
  <!-- Shard 4 (Stack shadow) -->
  <rect x="678" y="168" width="82" height="152" rx="6" fill="#061f18" stroke="#10b981" stroke-width="1" opacity="0.4" />
  <!-- Shard 3 (Stack shadow) -->
  <rect x="674" y="172" width="82" height="152" rx="6" fill="#072b20" stroke="#10b981" stroke-width="1" opacity="0.6" />
  <!-- Shard 2 (Stack shadow) -->
  <rect x="670" y="176" width="82" height="152" rx="6" fill="#0c3c2d" stroke="#10b981" stroke-width="1.2" opacity="0.8" />
  
  <!-- Shard 1 (Top Active) -->
  <g transform="translate(666, 180)">
    <rect width="82" height="152" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glow-green)" />
    
    <!-- Shard Title -->
    <text x="10" y="20" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">SHARD 01</text>
    <text x="10" y="32" fill="#10b981" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="700">CI ACTIVE</text>
    
    <!-- Shard metrics -->
    <line x1="10" y1="42" x2="72" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Test Case list visualization inside Shard -->
    <g transform="translate(10, 50)">
      <!-- Check 1 -->
      <circle cx="5" cy="5" r="4" fill="#10b981" />
      <text x="15" y="8" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="500">TC-001</text>

      <!-- Check 2 -->
      <circle cx="5" cy="18" r="4" fill="#10b981" />
      <text x="15" y="21" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="500">TC-002</text>

      <!-- Check 3 -->
      <circle cx="5" cy="31" r="4" fill="#10b981" />
      <text x="15" y="34" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="500">TC-003</text>

      <!-- Check 4 -->
      <circle cx="5" cy="44" r="4" fill="#10b981" />
      <text x="15" y="47" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="500">TC-004</text>
    </g>

    <!-- Pass indicator -->
    <rect x="10" y="115" width="62" height="22" rx="4" fill="#10b981" />
    <text x="21" y="129" fill="#0f172a" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="800">100% PASS</text>
  </g>

  <!-- Node: Playwright HTML Live Report -->
  <g transform="translate(650, 355)">
    <rect width="110" height="60" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <!-- Small graph spark -->
    <path d="M15 35 L25 25 L35 45 L45 15 L55 35" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="15" y="18" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">Live Report</text>
    <text x="15" y="28" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="500">HTML Playback</text>
  </g>

  <!-- Live CI Success Badge (Bottom Center) -->
  <g transform="translate(360, 440)">
    <rect width="220" height="24" rx="12" fill="#061f18" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="12" r="5" fill="#10b981" filter="url(#glow-green)" />
    <text x="35" y="16" fill="#a7f3d0" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.05em">AGENT ORCHESTRATION PIPELINE STABLE</text>
  </g>
</svg>
